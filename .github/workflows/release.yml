name: release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prerequisites:
    name: Check release prerequisites before publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Require every job to wait for this check
        run: ./scripts/release-prerequisites.sh gated .github/workflows/release.yml

      - name: Require the Java publication secrets
        env:
          MAVEN_CENTRAL_GPG_PRIVATE_KEY_B64: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY_B64 }}
          MAVEN_CENTRAL_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./scripts/release-prerequisites.sh check

  release:
    needs: prerequisites
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate and read release notes from CHANGELOG
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          ./scripts/release-notes.sh CHANGELOG.md "$version" > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"

      - name: Publish release artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release
            --clean
            --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq .body > "$RUNNER_TEMP/published-release-notes.md"
          ./scripts/release-body.sh verify \
            "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/published-release-notes.md"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

  publish-java:
    name: Publish Java Spring artifact to Maven Central
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: java-central-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify the complete signed bundle, then publish
        shell: bash
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY_B64 }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GPG_PRIVATE_KEY_B64:?missing signing key}"
          : "${MAVEN_GPG_PASSPHRASE:?missing signing passphrase}"
          : "${MAVEN_CENTRAL_USERNAME:?missing Central token username}"
          : "${MAVEN_CENTRAL_PASSWORD:?missing Central token password}"
          version="${GITHUB_REF_NAME#v}"
          release_revision=$(git rev-parse HEAD)
          python3 scripts/java-central.py set-version "$version"
          export GNUPGHOME="$RUNNER_TEMP/java-central-gnupg"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import >/dev/null 2>&1
          (cd sdk/java && ./mvnw -B -Pcentral-release -Dmaven.test.skip=true clean verify)
          python3 scripts/java-central.py build-bundle "$version"
          python3 scripts/java-central.py verify "$version"
          python3 scripts/java-central.py publish "$version" --release-revision "$release_revision"
