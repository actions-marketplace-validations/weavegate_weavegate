name: smoke

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Record runner environment
        continue-on-error: true
        run: |
          printf 'RUNNER_HOST kernel=%s architecture=%s logical_cpus=%s\n' "$(uname -sr)" "$(uname -m)" "$(nproc)"
          awk -F ': ' '/^model name/ { print "RUNNER_CPU model=" $2; exit }' /proc/cpuinfo
          awk '/^MemTotal:/ { print "RUNNER_MEMORY " $0 }' /proc/meminfo
          printf 'RUNNER_IMAGE os=%s version=%s\n' "${ImageOS:-not-recorded}" "${ImageVersion:-not-recorded}"
          go version
          docker version
          docker pull mysql:8.4
          docker image inspect mysql:8.4 --format 'RUNNER_MYSQL_IMAGE id={{.Id}} repo_digests={{json .RepoDigests}}'

      - name: Vet Go packages
        run: go vet ./...

      - name: Build Go packages
        run: go build ./...

      - name: Run database fixture tests
        run: >-
          go test ./internal/trace/... ./internal/oracle/...
          ./internal/fixture/... ./internal/scenario/... ./internal/orchestrator/...
          ./internal/syncpoint/... ./internal/sut/...
          ./fixtures/matching-slice/...
          ./cmd/weavegate/... ./internal/config/... ./internal/ci/...
          ./internal/diagnostic/... ./internal/report/...
          -coverprofile=cov.out -covermode=atomic -coverpkg=./internal/...
          -v -count=1 -timeout 12m | tee fixture.log

      - name: Report engine coverage
        run: |
          coverage=$(go tool cover -func=cov.out | tail -1 | awk '{print $3}')
          if [[ ! "$coverage" =~ ^[0-9]+\.[0-9]+%$ ]]; then
            echo "invalid engine coverage total: $coverage" >&2
            exit 1
          fi
          printf '## Engine coverage\n\n- `./internal/...`: %s\n' "$coverage" >> "$GITHUB_STEP_SUMMARY"
          printf 'COVERAGE_RESULT scope=internal total=%s\n' "$coverage"

      - name: Check the published coverage badge
        run: bash scripts/coverage-badge.sh --check

      - name: Assert the fixture invariants
        run: |
          grep -F 'MATCHING_FIXTURE_RESULT request_id=42 project_requests=1 matching_sessions=0 assignments=0 reset=true' fixture.log
          grep -F 'FIXTURE_LOADER_RESULT migrations=2 seed=1 order=lexicographic' fixture.log
          grep -F 'FIXTURE_LIFECYCLE_RESULT image=mysql:8.4 provision_rows=1 reset_rows=1 prepared_snapshot=stable digests=stable descriptor_same_database=true descriptor_reset=valid credentials=separate teardown=invalidated stale_reprovision_auth=denied' fixture.log

      - name: Assert the SUT adapter invariants
        run: |
          grep -F 'SUT_ADAPTER_RESULT command=probe workers=2 distinct_connections=2 errors=0 async=true worker_identity=preserved' fixture.log
          grep -F 'SUT_STOP_RESULT active_worker=cancelled outcome=unknown session_fault=true result_closed=true in_use=0 stop_idempotent=true' fixture.log
          grep -F 'SUT_WORKER_ID_RESULT duplicate_active=error extra_connection=false reuse_after_terminal=ok' fixture.log
          grep -F 'SUT_REGISTRY_RESULT commands=1 unknown_command=error missing_db=error stop_idempotent=true' fixture.log

      - name: Assert adapter outcome boundaries
        run: |
          grep -F 'SUT_FAULT_LATCH_RESULT first_cause=retained observers=all late_observer=notified' fixture.log
          grep -F 'SUT_SESSION_FAULT_RESULT before=observed during=cancelled after=invalidated cause=latched worker_result=never_fabricated' fixture.log
          grep -F 'SUT_CANCEL_BOUNDARY_RESULT collection=observed evaluation=observed cleanup=observed committed_worker_error=nil run_error=context_cancelled custom_cause=preserved' fixture.log
          grep -F 'SUT_UNSTARTED_RESULT invoke=returned cause=preserved stream=closed collected=true runtime_finish=never rollback=never' fixture.log
          grep -F 'SUT_OUTCOME_ERRORS_RESULT worker=evidence evaluation=joined session=joined cancellation=joined stop=joined provisional=discarded' fixture.log
          grep -F 'SUT_OUTCOME_STREAM_RESULT empty=rejected multiple=rejected malformed=rejected unfinished=rejected closure=before_evaluation' fixture.log
          grep -F 'SUT_ASYNC_UNSTARTED_RESULT invoke=nonblocking reservation=held cancellation=preserved resources=returned stream=closed worker_id=reusable' fixture.log
          grep -F 'SUT_COMMAND_ACCEPT_RESULT cancellation_wins=unstarted acceptance_wins=command_called ordering=serialized' fixture.log
          grep -F 'SUT_COMMIT_CANCEL_RESULT transaction=committed cancellation=after_commit worker_error=nil connection=returned' fixture.log

      - name: Assert the sync-point runtime invariants
        run: |
          grep -F 'SYNCPOINT_RUNTIME_RESULT worker=w1 points=2 targeted_release=true terminal=done blocked_arrive_unblocked=true' fixture.log
          grep -F 'SYNCPOINT_PROTOCOL_RESULT duplicate_worker=error unknown_worker=error release_before_arrive=error wrong_point=error duplicate_release=error concurrent_wait=error stale_wait=error' fixture.log
          grep -F 'SYNCPOINT_TIMEOUT_RESULT worker=w2 wait_status=timeout state=db_blocked inference=timeout resumed=arrived terminal=done' fixture.log
          grep -F 'SYNCPOINT_CANCEL_RESULT worker=w1 canceled_arrival=cleared release_after_cancel=error release_wins=nil ghost_arrival=false' fixture.log
          grep -F 'SYNCPOINT_CLOSE_RESULT blocked_arrivers=2 blocked_waiters=1 unblocked=3 close_idempotent=true' fixture.log

      - name: Assert the saved replay invariants
        run: |
          grep -F 'EXHAUSTIVE_STRATEGY_RESULT workers=2 points=2 candidates=6 total_known=true order=canonical per_worker_order=preserved unique_ids=6 saved_schedule_index=2 cap_exceeded=error invalid_scenario=error' fixture.log
          grep -F 'SCHEDULE_WRITE_RESULT id=sch_ba00582f9632 source=committed_fixture bytes=identical trailing_newline=true mode=0644 roundtrip=stable overwrite=ok nil_writer=error tamper=error' fixture.log
          grep -F 'EXPLORE_ENGINE_RESULT candidates=6 total_known=true evaluated=2 violating_index=2 stop_at_first=true resets=2 cleanup=ok run_error=propagated partial_summaries=2 nil_evaluator=error zero_oracles=error empty_sequence=error' fixture.log
          grep -F 'EXPLORE_EXHAUSTED_RESULT candidates=6 evaluated=6 violating=none exhausted=true cleanup=ok' fixture.log
          grep -F 'EXPLORE_UNKNOWN_TOTAL_RESULT total_known=false candidates=0 evaluated=3 violating_index=3 unknown_is_not_zero=true' fixture.log
          grep -F 'SCHEDULE_REPLAY_RESULT id=sch_ba00582f9632 steps=4 workers=2 per_worker_order=valid roundtrip=stable tamper=error' fixture.log
          grep -F 'ORCHESTRATOR_RUN_RESULT schedule=sch_ba00582f9632 workers=2 steps=4 timeouts=1 pending_resolved=1 terminal_done=2 cleanup=ok' fixture.log
          grep -F 'ORCHESTRATOR_REPLAY_CORE_RESULT schedule=sch_ba00582f9632 repeat=20 fingerprints=1 resets=20 flaky=false' fixture.log
          grep -F 'ORCHESTRATOR_ORACLE_RESULT schedule=sch_ba00582f9632 evaluations=20 oracles_per_evaluation=1 terminal_before_evaluation=true fingerprints=1 cleanup=ok flaky=false' fixture.log
          grep -F 'ORCHESTRATOR_CLASSIFY_RESULT timeout=timeout_inferred deadlock=mysql_deadlock_1213 distinct=true wrapped=true' fixture.log

      - name: Assert the SQL Oracle invariants
        run: |
          grep -F 'TRACE_MODEL_RESULT events=3 terminals=2 json=stable orchestrator_aliases=compatible' fixture.log
          grep -F 'ORACLE_SET_RESULT oracles=2 results=2 pass_results=1 violations=2 declaration_order=preserved fingerprint_order=canonical missing_oracle=changes_fingerprint invalid_result=error' fixture.log
          grep -F 'SQL_ASSERT_ORACLE_RESULT id=active-assignment-is-unique expect_rows=0 observed_rows=1 violations=1 evidence_json={"active_assignment_count":2,"project_request_id":42} invalid_utf8=error scan_error=error' fixture.log
          grep -F 'SQL_ASSERT_SCOPE_RESULT post_state=identical golden_projection=ignored differential_verdicts=pass,violation sql_verdicts=pass,pass differential_oracle=required' fixture.log
          grep -F 'SQL_ASSERT_MYSQL_READONLY_RESULT write=error state_unchanged=true' fixture.log

      - name: Assert the matching assignment invariants
        run: |
          grep -F 'MATCHING_ORACLE_RESULT schedule=sch_ba00582f9632 variant=vulnerable oracle=active-assignment-is-unique count_oracle=matching-workflow-counts oracles_evaluated=2 repeat=20 violation_runs=20 violations=20 evidence_rows=20 evidence_json={"active_assignment_count":2,"project_request_id":42} flaky=false' fixture.log
          grep -F 'MATCHING_ORACLE_RESULT schedule=sch_ba00582f9632 variant=fixed oracle=active-assignment-is-unique count_oracle=matching-workflow-counts oracles_evaluated=2 repeat=20 pass_runs=20 violations=0 evidence_rows=0 flaky=false' fixture.log
          grep -F 'MATCHING_REPLAY_RESULT schedule=sch_ba00582f9632 variant=vulnerable repeat=20 duplicate_runs=20 blocked_runs=0 sessions=2 assignments=2 active_assignments=2 worker_errors=0 deadlocks=0 flaky=false' fixture.log
          grep -F 'MATCHING_REPLAY_RESULT schedule=sch_ba00582f9632 variant=fixed repeat=20 pass_runs=20 blocked_runs=20 lock_wait_runs=20 sessions=1 assignments=1 active_assignments=1 worker_errors=0 deadlocks=0 flaky=false' fixture.log
          grep -F 'MATCHING_REPLAY_TIMING schedule=sch_ba00582f9632 runs=40 elapsed=' fixture.log
          grep -F 'SUT_ASSIGN_SEQUENTIAL_RESULT variant=vulnerable first_err=none second_err=none sessions=1 assignments=1 active_assignments=1 first_points=after_read_request,before_insert_assignment second_points=after_read_request' fixture.log
          grep -F 'SUT_ASSIGN_SEQUENTIAL_RESULT variant=fixed first_err=none second_err=none sessions=1 assignments=1 active_assignments=1 first_points=after_read_request,before_insert_assignment second_points=after_read_request' fixture.log
          grep -F 'SUT_ROLLBACK_RESULT variant=vulnerable failed_point=before_insert_assignment sessions=0 assignments=0 err=propagated' fixture.log
          grep -F 'SUT_ASSIGN_ERROR_RESULT case=missing_request err=propagated sessions=0 assignments=0' fixture.log
          grep -F 'SUT_ASSIGN_ERROR_RESULT case=inactive_request err=propagated sessions=0 assignments=0' fixture.log

      - name: Assert the baseline comparison invariants
        run: |
          grep -E 'MATCHING_BASELINE_RESULT arm=plain variant=vulnerable iterations=100 launch=concurrent detections=[0-9]+ worker_errors=0 deadlocks=0 elapsed=' fixture.log
          grep -E 'MATCHING_BASELINE_RESULT arm=hinted_delay variant=vulnerable iterations=100 launch=concurrent delay_ms=2 delay_point=before_insert_assignment detections=[0-9]+ worker_errors=0 deadlocks=0 elapsed=' fixture.log
          grep -E 'MATCHING_BASELINE_RESULT arm=staggered_launch variant=vulnerable iterations=100 launch=staggered stagger_ms=2 detections=[0-9]+ worker_errors=0 deadlocks=0 elapsed=' fixture.log
          grep -E 'MATCHING_BASELINE_RESULT arm=staggered_launch variant=vulnerable iterations=100 launch=staggered stagger_ms=20 detections=[0-9]+ worker_errors=0 deadlocks=0 elapsed=' fixture.log
          grep -E 'MATCHING_BASELINE_RESULT arm=staggered_launch variant=vulnerable iterations=100 launch=staggered stagger_ms=100 detections=[0-9]+ worker_errors=0 deadlocks=0 elapsed=' fixture.log
          grep -E 'MATCHING_BASELINE_RESULT arm=control_serial variant=vulnerable iterations=100 launch=serial detections=0 worker_errors=0 deadlocks=0 elapsed=' fixture.log
          grep -E 'MATCHING_BASELINE_COMPARE baseline_plain=[0-9]+/100 baseline_hinted=[0-9]+/100 baseline_staggered_2ms=[0-9]+/100 baseline_staggered_20ms=[0-9]+/100 baseline_staggered_100ms=[0-9]+/100 control_serial=0/100 schedule_replay=20/20 schedule=sch_ba00582f9632 image=mysql:8.4 same_fixture=true replayable=schedule_only' fixture.log

      - name: Assert the matching exploration invariants
        run: |
          grep -E 'MATCHING_EXPLORE_RESULT variant=vulnerable candidates=6 repeats=20 evaluated=[1-9][0-9]* distinct_schedules=1 distinct_indices=1 distinct_fingerprints=1 violating_index=[1-6] schedule=sch_[0-9a-f]{12} saved=reloaded replay_repeat=20 violation_runs=20 fingerprint_match=true worker_errors=0 deadlocks=0 flaky=false' fixture.log
          grep -E 'MATCHING_EXPLORE_CENSUS variant=vulnerable candidates=6 repeats=3 evaluated=18 violating_candidates=[0-6] stable=true' fixture.log
          grep -E 'MATCHING_EXPLORE_RESULT variant=fixed candidates=6 repeats=5 evaluated=30 violating=none exhausted=true pending_resolved_runs=[0-9]+ terminal_skipped_runs=[0-9]+ worker_errors=0 deadlocks=0' fixture.log

      - name: Assert the command-line contract
        run: |
          grep -F 'FIXTURE_DIGEST_RESULT migration=sha256_full seed=sha256_full framing=byte_length collision=distinct' fixture.log
          grep -F 'CONFIG_LOAD_RESULT scenarios=1 workers=2 sync_points=2 assertions=1 repeat=20 arrive_timeout_ms=250 explore_passes=3 defaults=applied relative_paths=resolved unknown_key=error report_section=error trailing_document=error missing_required=error non_mysql_db=error path_entrypoint=error bad_expect_rows=error missing_expect_rows=error bad_assertion_id=error duplicate_worker=error duplicate_sync_point=error nonpositive_run_value=error explicit_zero_run_value=error worker_args_mismatch=error worker_args_key_presence_mismatch=error unsupported_adapter=error' fixture.log
          grep -F 'EXIT_CODE_RESULT pass=0 violation=2 flaky=3 fixture=4 input=5 output=5 interrupted=130 unclassified=5 error_beats_verdict=true flaky_beats_violation=true cleanup_on_pass=4 cleanup_keeps_violation=2 cleanup_never_masks=true' fixture.log
          grep -F 'RUN_ARTIFACT_RESULT files=6_or_7 schedule_file=present_when_scheduled umask=0077 dir_mode=0700 file_mode=0600 key_order=canonical empty_slice=json_array trailing_newline=true volatile_files=manifest+report_json deterministic_files=5 rerun_identical=5_of_7 replay_line=out_omitted shell_quote=posix config_path=as_given tmp_same_filesystem=true partial_write=cleaned write_failure=output_error' fixture.log
          grep -F 'ARTIFACT_V2_RESULT files=6_or_7 writer=v2 schedule=neutral schedule_file=canonical mode=recorded direct_replay_discovery=omitted passing_replay=replayed legacy_reader=v1+v2+v3' fixture.log
          grep -F 'ARTIFACT_VERSION_RESULT ordinary=v2 retained_diagnostic_failure=v3 run_scoped_json=consistent copied_evidence=distinguishable' fixture.log
          grep -F 'CLI_ROOT_RESULT version=printed no_args=help exit=0 unknown_command=5 unknown_flag=5 errors=stderr results=stdout usage_dump=suppressed' fixture.log
          grep -F 'CLI_PLAN_RESULT empty_replay=5 missing_replay=5 incompatible_replay=5 oversized_candidates=5 empty_override=5 missing_fixture=5 malformed_fixture=5 fixture_factory_calls=0 docker=false' fixture.log
          grep -F 'CLI_REPLAY_LOOKUP_RESULT embedded=true schedules_dir=true stage_order=run_evidence,schedules_dir,embedded outside_repo=true literal_out=true id_grammar=strict run_dir_grammar=enforced staging_dir=skipped run_evidence_id=verified unverified_run_evidence=falls_through malformed_schedules_file=error unresolved_names_all_stages=true content_id_collision=ambiguous_exit5 reader=v1+v2+v3' fixture.log
          grep -F 'CLI_REPLAY_QUOTE_RESULT argv=preserved whitespace=true single_quote=true metachar=true out=omitted' fixture.log
          grep -F 'CLI_RESOLVE_RESULT entrypoint=matching-slice adapter=gonative variant=vulnerable workers=2 sync_points=2 oracles=1 oracle_order=preserved image=mysql:8.4 block_ms=250 step_ms=5000 run_ms=15000 stop_ms=5000 unregistered_adapter=5 unknown_entrypoint=5 unknown_variant=5 bad_scenario=5 no_container=true' fixture.log
          grep -F 'CLI_REPORT_RESULT json=byte_identical md=byte_identical default_format=json run_identity=opaque_128bit latest_run=manifest_started_at same_time_ties=id_tiebreak invalid_dirs=ignored missing_run=5 invalid_run_id=5 bad_format=5 short_write=5 no_rerender=true' fixture.log
          grep -F 'CLI_INTERRUPT_RESULT exit=130 teardown_calls=1 cleanup_deadline=30s operation_cancel=detached second_signal=default' fixture.log
          grep -F 'FIXTURE_TEARDOWN_CONTEXT_RESULT deadline=honored calls=1 state=retryable pool_close=bounded' fixture.log
          grep -F 'CLI_VERDICT_RESULT all_violation=2 partial_violation=3 all_pass_after_discovery=3 fingerprint_mismatch=3 replay_mode_flaky=3 exhausted=0' fixture.log
          grep -F 'CLI_REPLAY_COMMAND_RESULT source=report_md executed=verbatim argv=preserved out=omitted resolved_from=run_directory verdict=identical exit=2' fixture.log
          grep -F 'CLI_REPLAY_PORTABLE_RESULT source=report_md executed=verbatim run_dir=absent schedules_dir=present out=omitted verdict=identical diagnostic=WG001 exit=2 missing_schedule=5' fixture.log
          grep -F 'CLI_RUN_FAILURE_RESULT bad_config=5 missing_scenario=5 unknown_scenario=5 nonpositive_repeat_override=5 unknown_schedule=5 unverifiable_run_evidence=5 unwritable_out=5 missing_fixture_source=5 artifacts_written_on_pass=true cleanup_failure_on_pass=4 fixture_failure_during_replay=4 diagnostic_derivation_failure=5 diagnostic_failure_artifacts=7 diagnostic_failure_version=3 stdout_write_failure=5' fixture.log
          grep -E 'CLI_RUN_RESULT mode=explore variant=vulnerable passes=1 evaluated=[1-9][0-9]* schedule=sch_[0-9a-f]{12} repeat=20 violation_runs=20 flaky=false diagnostic=WG001 artifacts=7 exit=2' fixture.log
          grep -F 'CLI_RUN_RESULT mode=explore variant=fixed passes=3 evaluated=18 violating=none exhausted=true flaky=false diagnostic=none artifacts=6 exit=0' fixture.log
          grep -F 'CLI_RUN_RESULT mode=replay variant=vulnerable schedule=sch_ba00582f9632 repeat=20 violation_runs=20 flaky=false diagnostic=WG001 artifacts=7 exit=2' fixture.log

      - name: Assert the diagnostic contract
        run: |
          grep -F 'DIAGNOSTIC_TYPE_RESULT code_grammar=strict severity=error trigger_vocabulary=closed implemented_triggers=2 reserved_triggers=5 required_fields=enforced empty_help=error empty_triggers=error kind_mapping=oracle_kind json_shape=spec9' fixture.log
          grep -F 'DIAGNOSTIC_RULES_RESULT codes=2 source=embedded filename_code_match=enforced duplicate_code=error duplicate_trigger=error unknown_trigger=error missing_help=error lookup=by_trigger order=sorted outside_repo=true' fixture.log
          grep -F 'DIAGNOSTIC_DERIVE_RESULT key=violation_kind config_input=none unit=code_and_oracle rows=representative_set evidence_sets=counted row_data=preserved_for_report_boundary trace=corresponding_run_only observation=always order=oracle_declaration flaky=engine_last reserved_trigger=skipped unknown_kind=error implemented_kinds=all_mapped map_iteration=absent stable=true' fixture.log
          grep -F 'REPORT_DIAGNOSTIC_RESULT field=observation.diagnostics files=6_or_7 empty=json_array dto=report_owned merged=report_json deterministic=true' fixture.log
          grep -F 'REPORT_MARKDOWN_DIAGNOSTIC_RESULT headline=code_suffixed block=compiler_style label_width=constant no_diagnostics=byte_identical_to_previous multi_help=aligned multi_diagnostic=ordered flaky=wg090 render=single_source' fixture.log
          grep -F 'REPORT_MARKDOWN_SAFETY_RESULT boundary=internal_report fields=all_rendered newline=escaped terminal_control=escaped invalid_utf8=byte_escaped markdown=escaped math=escaped structured_json=unchanged replay=pasteable_when_unescaped' fixture.log
          grep -F 'CLI_DIAGNOSTIC_RESULT rule_table=embedded load_failure=5 preflight=before_fixture fixture_factory_calls=0 kind_source=oracle_violation oracle_order=preserved verdict_unchanged=true exit_policy_unchanged=true config_keys_added=0' fixture.log

      - name: Run the lost-update experiment
        run: go test ./experiments/lost-update/... -v -count=1 | tee lostupdate.log

      - name: Assert the experiment invariants
        run: |
          grep -Eq 'LOSTUPDATE_RESULT path=vulnerable .* lost=[1-9][0-9]*' lostupdate.log
          grep -Eq 'LOSTUPDATE_RESULT path=fixed .* lost=0( |$)' lostupdate.log

  race:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Repeat adapter outcome boundary tests
        run: |
          go test ./internal/orchestrator ./internal/sut ./internal/sut/gonative ./fixtures/matching-slice/sut \
            -run 'TestOutcome|TestRunPreservesCancellationBeforeFinalizationSetup|TestFaultLatch|TestGoNativeUnstartedWorkerCleanup|TestGoNativeAsyncUnstarted|TestGoNativeCleanupSessionFault|TestGoNativeMasksAcceptedCommandCancellationSentinel|TestWorkerAcceptance|TestAssignBeginFailureReportsUnstarted|TestAssignUnknownTransactionCompletionFaultsSession' -count=20
          go test -race ./internal/orchestrator ./internal/sut ./internal/sut/gonative ./fixtures/matching-slice/sut \
            -run 'TestOutcome|TestRunPreservesCancellationBeforeFinalizationSetup|TestFaultLatch|TestGoNativeUnstartedWorkerCleanup|TestGoNativeAsyncUnstarted|TestGoNativeCleanupSessionFault|TestGoNativeMasksAcceptedCommandCancellationSentinel|TestWorkerAcceptance|TestAssignBeginFailureReportsUnstarted|TestAssignUnknownTransactionCompletionFaultsSession' -count=20

      - name: Run the race detector
        run: |
          go test -race ./internal/... ./fixtures/... -count=1
          echo 'RACE_JOB_RESULT scope=internal+fixtures count=1 detector=on'

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: ./...

  notice:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the generated NOTICE inventory
        run: |
          ./scripts/gen-notice.sh
          git ls-files --error-unmatch NOTICE > /dev/null
          git diff --exit-code -- NOTICE

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Verify the conformance pin against its reviewed commit.

      - name: Check the diagnostic namespace
        run: |
          bash scripts/diagnostic-namespace.sh --self-test | tee /tmp/diagnostic-namespace-selftest.out
          for marker in GATE_BITES BARE_RG_CAUGHT LOWER_RG_CAUGHT; do
            grep -qF "$marker" /tmp/diagnostic-namespace-selftest.out
          done
          bash scripts/diagnostic-namespace.sh . | tee /tmp/diagnostic-namespace.out
          grep -qF 'DIAGNOSTIC_NAMESPACE_RESULT prefix=WG legacy=rejected scope=tracked_files' \
            /tmp/diagnostic-namespace.out

      - name: Check the documentation index
        run: |
          bash scripts/docs-index.sh --self-test | tee /tmp/docs-index-selftest.out
          for marker in MISSING_FROM_INDEX_CAUGHT GHOST_ENTRY_CAUGHT \
            DUPLICATE_ENTRY_CAUGHT MARKER_TRACKS_COUNT ASSET_IGNORED NUL_INVENTORY_SAFE \
            FENCED_EXAMPLE_IGNORED TILDE_FENCE_IGNORED LONG_FENCE_IGNORED \
            INDENTED_CLOSER_IGNORED INLINE_SPAN_IGNORED TITLED_LINK_INDEXED \
            DOTSLASH_NORMALIZED UTF8_DEST_NORMALIZED \
            ANGLE_DEST_INDEXED GHOST_STILL_BITES UNCLOSED_FENCE_STILL_BITES \
            INDEX_MISSING_CAUGHT INDEX_UNTRACKED_CAUGHT EMPTY_TREE_CAUGHT \
            FENCED_COMMENT_IGNORED COMMENTED_FENCE_IGNORED \
            MISSING_DESCRIPTION_CAUGHT MALFORMED_ENTRY_DISTINCT \
            INDENTED_BLOCK_IGNORED CONTROL_ESCAPE_CAUGHT RAW_HTML_ENTRY_IGNORED \
            RAW_HTML_TYPES_IGNORED ESCAPED_LABEL_REJECTED MARKDOWN_ESCAPE_NORMALIZED \
            PERCENT_DEST_NORMALIZED PERCENT_FILENAME_CAUGHT; do
            grep -qF "$marker" /tmp/docs-index-selftest.out
          done
          bash scripts/docs-index.sh . | tee /tmp/docs-index.out
          grep -Eq '^DOCS_INDEX_RESULT pages=[0-9]+ indexed=[0-9]+ orphans=0 ghosts=0 duplicates=0$' \
            /tmp/docs-index.out

      - name: Check the release notes date guard
        run: |
          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT

          cat > "$work_dir/placeholder.md" <<'CHANGELOG'
          `YYYY-MM-DD` documents the release-heading convention.

          ## [0.1.0-alpha] - YYYY-MM-DD

          Release body.
          CHANGELOG
          sed 's/^## \[0\.1\.0-alpha\] - YYYY-MM-DD$/## [0.1.0-alpha] - not-a-date/' \
            "$work_dir/placeholder.md" > "$work_dir/dateless.md"
          cat > "$work_dir/dated.md" <<'CHANGELOG'
          `YYYY-MM-DD` documents the release-heading convention.

          ## [0.1.0-alpha] - 2026-08-27

          Release body.
          CHANGELOG
          cat > "$work_dir/expected.md" <<'NOTES'

          Release body.
          NOTES

          if ./scripts/release-notes.sh "$work_dir/placeholder.md" 0.1.0-alpha > /dev/null 2>&1; then
            echo "release notes guard accepted a placeholder date" >&2
            exit 1
          fi
          if ./scripts/release-notes.sh "$work_dir/dateless.md" 0.1.0-alpha > /dev/null 2>&1; then
            echo "release notes guard accepted a dateless heading" >&2
            exit 1
          fi
          if ./scripts/release-notes.sh "$work_dir/dated.md" 9.9.9 > /dev/null 2>&1; then
            echo "release notes guard accepted a missing section" >&2
            exit 1
          fi
          ./scripts/release-notes.sh "$work_dir/dated.md" 0.1.0-alpha > "$work_dir/actual.md"
          cmp "$work_dir/actual.md" "$work_dir/expected.md"

          echo "RELEASE_NOTES_GUARD_RESULT placeholder=rejected dateless=rejected missing_section=rejected dated=accepted body=exact heading_scope=only"

      - name: Check the published release body contract
        run: |
          bash scripts/release-body.sh --self-test | tee /tmp/release-body-selftest.out
          for marker in EXACT_BODY_ACCEPTED TRAILING_NEWLINES_NORMALIZED \
            EMPTY_EXPECTED_CAUGHT EMPTY_ACTUAL_CAUGHT BODY_MISMATCH_CAUGHT; do
            grep -qF "$marker" /tmp/release-body-selftest.out
          done
          grep -qF \
            'RELEASE_BODY_RESULT exact=accepted trailing_newlines=normalized expected_empty=rejected actual_empty=rejected mismatch=rejected' \
            /tmp/release-body-selftest.out

      - name: Check proposed external SUT vectors
        run: |
          python3 scripts/check-external-sut-vectors.py --self-test | tee /tmp/external-sut-vectors-selftest.out
          grep -qF 'EXTERNAL_SUT_VECTOR_SELF_TEST_RESULT mutations=rejected' /tmp/external-sut-vectors-selftest.out
          for marker in VECTOR_TERMINAL_GATE_CLEANUP_CAUGHT VECTOR_TERMINAL_ACCEPTED_CAUGHT \
            VECTOR_TERMINAL_PROXY_CAUGHT VECTOR_TERMINAL_TRANSACTION_CAUGHT \
            VECTOR_TERMINAL_LEASE_CAUGHT VECTOR_CANCEL_BRIDGE_CLEANUP_CAUGHT \
            VECTOR_UNKNOWN_EXPECTATION_CAUGHT VECTOR_STOPPED_AFTER_FATAL_CAUGHT \
            VECTOR_TERMINAL_AFTER_FATAL_CAUGHT VECTOR_RETIRED_IDENTICAL_BODY_CAUGHT \
            VECTOR_RETIRED_CONFLICT_BODY_CAUGHT VECTOR_RETIRED_RESULT_EFFECT_CAUGHT \
            VECTOR_RETIRED_FATAL_EXCHANGE_CAUGHT VECTOR_PROCESS_DEATH_REAP_CAUGHT \
            VECTOR_PROCESS_DEATH_RESET_CAUGHT VECTOR_PROCESS_DEATH_UNWIND_CAUGHT; do
            grep -qF "$marker" /tmp/external-sut-vectors-selftest.out
          done
          python3 scripts/check-external-sut-vectors.py | tee /tmp/external-sut-vectors.out
          grep -qF 'EXTERNAL_SUT_VECTOR_RESULT structure=valid scope=explicit coverage=present runtime=not_executed' /tmp/external-sut-vectors.out

      - name: Check external SUT acceptance accounting
        run: |
          python3 scripts/test-external-sut-acceptance.py | tee /tmp/external-sut-accounting.out
          grep -qF 'EXTERNAL_SUT_ACCOUNTING_TEST_RESULT omissions=rejected evidence=required runtime=not_executed' /tmp/external-sut-accounting.out
          for target in go java paired; do
            manifest="docs/reference/testdata/external-sut-results-${target}.json"
            python3 scripts/check-external-sut-acceptance.py --results "$manifest" | tee "/tmp/external-sut-${target}.out"
            grep -qF "EXTERNAL_SUT_ACCEPTANCE_RESULT target=${target} manifest=valid acceptance=incomplete pass=0" "/tmp/external-sut-${target}.out"
            if python3 scripts/check-external-sut-acceptance.py --results "$manifest" --require-complete; then
              echo "unexecuted ${target} manifest unexpectedly passed acceptance" >&2
              exit 1
            fi
          done

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            './**/*.md'
          fail: true

  external-adapter:
    if: github.event_name != 'schedule'
    name: external Go peer (partial acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Repeat external adapter tests
        run: |
          mkdir -p external-evidence
          go test ./internal/sut/external -v -count=20 | tee external-evidence/go.log
          grep -F 'EXTERNAL_SUT_BRIDGE_RESULT targeted=true reader=live incremented=true worker_reuse=isolated retired_terminal=no_effect rollback=error' external-evidence/go.log
          grep -F 'EXTERNAL_SUT_CANCEL_RESULT cancel_wins=no_release release_wins=release_then_cancel reuse=fresh' external-evidence/go.log
          grep -F 'EXTERNAL_SUT_DEATH_RESULT fault=transport outcome=absent bridge=unwound child=reaped stop=error' external-evidence/go.log
          grep -F 'EXTERNAL_SUT_TERMINAL_FAULT_RESULT validated=preserved unknown=absent late_terminal=ignored publication=after_bridge stop=error' external-evidence/go.log
          grep -F 'EXTERNAL_SUT_PROCESS_RESULT launch=owned pipes=real writer=bounded eof=supervised child=reaped stop=idempotent' external-evidence/go.log
          grep -F 'EXTERNAL_SUT_RUN_RESULT late_fatal=invalidates late_death=invalidates committed_result=preserved cancellation=run_error fingerprints=stable' external-evidence/go.log
          grep -F 'EXTERNAL_SUT_FRAMING_RESULT pin=f32cd292246287a22c1a057012dd468f25c41c7d malformed=rejected control=independent' external-evidence/go.log
          grep -F 'EXTERNAL_SUT_VECTOR_SUBSET_RESULT cases=13 dispatch=closed assertions=observed acceptance=incomplete' external-evidence/go.log

      - name: Repeat external adapter race tests
        run: go test ./internal/sut/external -race -count=20 | tee external-evidence/race.log

      - name: Record observed checks without completing missing acceptance
        run: |
          python3 scripts/test-external-sut-go-results.py | tee external-evidence/accounting.log
          grep -F 'EXTERNAL_SUT_GO_RECORD_TEST_RESULT missing=incomplete unknown=rejected repetitions=checked failures=rejected' external-evidence/accounting.log
          python3 scripts/record-external-sut-go-results.py \
            --log external-evidence/go.log --output external-evidence/go.json \
            --revision "$GITHUB_SHA" \
            --command 'go test ./internal/sut/external -v -count=20' \
            --go-version "$(go version)"
          python3 scripts/check-external-sut-acceptance.py --results external-evidence/go.json

      - name: Upload external adapter evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-go-evidence
          path: external-evidence/

  external-java:
    if: github.event_name != 'schedule'
    name: external Java peer (isolated acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Repeat Java peer tests
        working-directory: sdk/java
        run: |
          evidence="$GITHUB_WORKSPACE/external-java-evidence"
          mkdir -p "$evidence"
          maven_command=(./mvnw -B verify -Dweavegate.repetitions=20 "-Dweavegate.evidence=$evidence/java.log")
          printf '%q ' "${maven_command[@]}" > "$evidence/command.txt"
          "${maven_command[@]}" | tee "$evidence/build.log"
          grep -F 'EXTERNAL_SUT_JAVA_VECTOR_RESULT pin=f32cd292246287a22c1a057012dd468f25c41c7d cases=40 framing=11 dispatch=closed assertions=observed' "$evidence/java.log"
          grep -F 'EXTERNAL_SUT_JAVA_DISPATCH_RESULT events=closed arguments=closed assertions=closed injection=none' "$evidence/java.log"
          grep -F 'EXTERNAL_SUT_JAVA_EXCEPTION_SHAPE_RESULT phases=3 unknown_phase=rejected injection=none' "$evidence/java.log"
          grep -F 'EXTERNAL_SUT_JAVA_CANCEL_ORIGIN_RESULT context_then_stop=context stop_only=stop first_latched=retained' "$evidence/java.log"
          grep -F 'EXTERNAL_SUT_JAVA_WIRE_MATRIX_RESULT coalesced=ordered invalid=fatal duplicates=consumed acceptance=complete' "$evidence/java.log"
          grep -F 'EXTERNAL_SUT_JAVA_DISABLED_RESULT sync_point=immediate stdin=unread protocol_threads=none transaction=unchanged' "$evidence/java.log"
          grep -F 'EXTERNAL_SUT_JAVA_SPRING_RESULT terminal=after_proxy_commit_close begin_failure=not_started rollback_only=rolled_back after_commit=committed_error unknown_commit=fatal unknown_rollback=fatal suppressed_close=fatal cancel=rolled_back jdbc_cancel=requested' "$evidence/java.log"
          grep -F 'EXTERNAL_SUT_JAVA_PROCESS_RESULT pipes=real success=stopped_eof_exit0 eof=startup,active,post_terminal,stop writer=broken,blocked watchdog=self_exit' "$evidence/java.log"
          grep -F 'EXTERNAL_SUT_JAVA_FAILURE_ORDER_RESULT body=before_cleanup after_commit=before_cleanup cancellation=later' "$evidence/java.log"

      - name: Require complete isolated Java acceptance
        run: |
          evidence=external-java-evidence
          python3 scripts/test-external-sut-java-results.py | tee "$evidence/accounting.log"
          grep -F 'EXTERNAL_SUT_JAVA_RECORD_TEST_RESULT missing=incomplete unknown=rejected repetitions=checked failures=rejected' "$evidence/accounting.log"
          python3 scripts/record-external-sut-java-results.py \
            --log "$evidence/java.log" --build-log "$evidence/build.log" --output "$evidence/java.json" \
            --revision "$GITHUB_SHA" \
            --command "$(cat "$evidence/command.txt")"
          python3 scripts/check-external-sut-acceptance.py --results "$evidence/java.json" --require-complete

      - name: Upload Java peer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-java-evidence
          path: external-java-evidence/

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: external links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check external Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            './**/*.md'
          fail: true

  toolchain:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: [minimum, stable]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the minimum Go version
        if: matrix.go == 'minimum'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up stable Go
        if: matrix.go == 'stable'
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build and test non-container packages
        run: |
          go build ./...
          go test \
            ./internal/ci/... ./internal/config/... ./internal/diagnostic/... ./internal/oracle \
            ./internal/orchestrator/... ./internal/report/... ./internal/scenario/... \
            ./internal/sut ./internal/sut/external ./internal/syncpoint/... ./internal/trace/... ./rules/... -count=1
          printf 'TOOLCHAIN_RESULT go=%s scope=non-container build=ok\n' "$(go env GOVERSION)"
