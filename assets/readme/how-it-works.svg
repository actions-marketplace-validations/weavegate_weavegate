<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">weavegate architecture and execution flow</title><desc id="desc">Configuration and fixture data enter the orchestrator. Dashed blue lines control two system-under-test workers at sync-points. Workers transact with MySQL, SQL oracles judge state, and reports retain the schedule, trace, observations, and exit code.</desc>
  <defs><style>.sans{font-family:'IBM Plex Sans',Arial,sans-serif}.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#0b6e6a}.title{font-size:29px;font-weight:700;fill:#0d1117}.head{font-size:16px;font-weight:700;fill:#0d1117}.label{font-size:12px;font-weight:700;fill:#3d4653}.body{font-size:12px;fill:#4f5a68}.tiny{font-size:11px;fill:#6e7781}.monoText{font-size:11px;fill:#3d4653}.flow{stroke:#0f8b86;stroke-width:3;fill:none;marker-end:url(#ta)}.control{stroke:#0969da;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#ba)}</style><marker id="ta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#0f8b86"/></marker><marker id="ba" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#0969da"/></marker></defs>
  <rect width="1200" height="520" fill="#f8f9fa"/><path d="M0 0h1200v6H0z" fill="#0b6e6a"/><text class="sans eyebrow" x="42" y="42">SYSTEM AT A GLANCE</text><text class="sans title" x="42" y="78">Control execution. Keep judgment at the edge.</text><text class="sans tiny" x="1158" y="76" text-anchor="end">solid teal · data/evidence    dashed blue · schedule control</text><line x1="42" y1="101" x2="1158" y2="101" stroke="#d8dde2"/>
  <g transform="translate(42 132)"><text class="sans label">01 · DECLARE</text><rect y="20" width="210" height="265" rx="5" fill="#fff" stroke="#d8dde2"/><rect y="20" width="4" height="265" fill="#0b6e6a"/><text class="sans head" x="22" y="58">Fixture + config</text><text class="sans body" x="22" y="86">scenario and schedules</text><text class="sans body" x="22" y="108">migration + seed data</text><text class="sans body" x="22" y="130">SQL assertions</text><line x1="22" y1="153" x2="188" y2="153" stroke="#e8ebee"/><text class="mono monoText" x="22" y="180">config.yaml</text><text class="mono monoText" x="22" y="204">scenario.json</text><text class="mono monoText" x="22" y="228">migration.sql</text><text class="mono monoText" x="22" y="252">seed.sql</text></g>
  <g transform="translate(324 132)"><text class="sans label">02 · ORCHESTRATE</text><rect y="20" width="278" height="265" rx="5" fill="#eff9f8" stroke="#6fcbc6"/><text class="sans head" x="22" y="58">Schedule engine</text><text class="sans body" x="22" y="84">enumerate · release · replay · repeat</text><rect x="22" y="108" width="234" height="50" rx="3" fill="#fff" stroke="#d8dde2"/><text class="mono monoText" x="38" y="130">A1 → B1 → A2 → B2</text><text class="sans tiny" x="38" y="149">portable coordination intent</text><rect x="22" y="179" width="234" height="70" rx="3" fill="#0d1117"/><text class="mono" x="38" y="203" font-size="11" fill="#8b949e">candidate</text><text class="mono" x="112" y="203" font-size="11" fill="#3ad0c8">1 / 6</text><text class="mono" x="38" y="226" font-size="11" fill="#8b949e">repeat</text><text class="mono" x="112" y="226" font-size="11" fill="#e8ebee">20</text></g>
  <g transform="translate(674 132)"><text class="sans label">03 · EXECUTE</text><rect y="20" width="230" height="265" rx="5" fill="#fff" stroke="#d8dde2"/><text class="sans head" x="22" y="58">Go / JVM SUT</text><text class="mono monoText" x="22" y="82">read → decide → write</text><g transform="translate(22 106)"><rect width="186" height="48" rx="3" fill="#f2f4f5" stroke="#d8dde2"/><path d="M0 0v48" stroke="#0f8b86" stroke-width="4"/><text class="mono label" x="16" y="20">worker A</text><text class="sans tiny" x="16" y="38">own DB connection</text><rect y="62" width="186" height="48" rx="3" fill="#f2f4f5" stroke="#d8dde2"/><path d="M0 62v48" stroke="#0969da" stroke-width="4"/><text class="mono label" x="16" y="82">worker B</text><text class="sans tiny" x="16" y="100">own DB connection</text><rect y="130" width="186" height="36" rx="3" fill="#fff" stroke="#b9c0c8"/><text class="sans label" x="93" y="153" text-anchor="middle">MySQL 8.4 · InnoDB</text></g></g>
  <g transform="translate(976 132)"><text class="sans label">04 · JUDGE + RETAIN</text><rect y="20" width="182" height="265" rx="5" fill="#fff" stroke="#d8dde2"/><rect y="20" width="4" height="265" fill="#d1242f"/><text class="sans head" x="20" y="58">SQL oracle</text><text class="sans body" x="20" y="84">configured invariant</text><text class="sans body" x="20" y="104">violating rows</text><rect x="20" y="127" width="142" height="35" rx="3" fill="#ffe9e9"/><text class="mono" x="34" y="150" font-size="12" font-weight="700" fill="#a40e19">FAIL · WG001</text><line x1="20" y1="184" x2="162" y2="184" stroke="#e8ebee"/><text class="mono monoText" x="20" y="208">schedule</text><text class="mono monoText" x="20" y="229">trace + rows</text><text class="mono monoText" x="20" y="250">report + exit 2</text></g>
  <path class="flow" d="M252 274h72"/><path class="control" d="M602 223h72"/><path class="control" d="M602 285h72"/><path class="flow" d="M904 324h72"/>
  <rect x="42" y="453" width="1116" height="40" rx="3" fill="#fff" stroke="#d8dde2"/><path d="M42 453v40" stroke="#0b6e6a" stroke-width="3"/><text class="sans body" x="62" y="478">Engine boundary · fixtures are data, adapters implement a protocol, and verdict logic lives only in composable oracles.</text>
</svg>
