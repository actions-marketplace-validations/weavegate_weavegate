<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Measured replay, control, exploration, Spring Boot, and gate run-time results</title><desc id="desc">Saved schedule replay reproduced 20 of 20 violations in each of three invocations. Controls found zero of 100. Exploration evaluated six candidates in 25.5 seconds and saved candidate index one. Through the external JVM adapter, a Spring Boot fixture replayed the same schedule with WG001 in 20 of 20 vulnerable runs and PASS in 20 of 20 fixed runs. On a GitHub-hosted runner, a v0.2.0 gate job for a Spring Boot example took 85 to 129 seconds, of which the weavegate step took 67 to 110 seconds.</desc>
  <defs><style>.sans{font-family:'IBM Plex Sans',Arial,sans-serif}.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#0b6e6a}.title{font-size:29px;font-weight:700;fill:#0d1117}.metric{font-size:35px;font-weight:700;fill:#0d1117}.label{font-size:14px;font-weight:700;fill:#3d4653}.small{font-size:12px;fill:#6e7781}.monoSmall{font-size:11px;fill:#4f5a68}</style></defs><rect width="1200" height="520" fill="#f8f9fa"/><path d="M0 0h1200v6H0z" fill="#0b6e6a"/><text class="sans eyebrow" x="42" y="42">MEASURED EVIDENCE</text><text class="sans title" x="42" y="78">One schedule. Repeatable verdicts.</text><text class="sans small" x="1158" y="76" text-anchor="end">matching-slice · spring-matching · adoption example · MySQL 8.4</text><line x1="42" y1="101" x2="1158" y2="101" stroke="#d8dde2"/>
